[project]
name = "mapox-trainer"
version = "0.1.1"
description = "JAX/Flax multi-agent reinforcement learning framework with transformer-based PPO agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coolname>=4.0.0",
    "distrax>=0.1.5",
    "einops>=0.8.1",
    "flax>=0.10.6",
    "fsspec[gcs]>=2025.5.1",
    "jax>=0.6.0",
    "mapox==0.2.0",
    "matplotlib>=3.10.5",
    "optax>=0.2.4",
    "orbax>=0.1.9",
    "pydantic>=2.11.4",
    "pygame-ce>=2.5.7",
    "python-ffmpeg>=2.0.12",
    "rich>=14.0.0",
    "seaborn>=0.13.2",
    "tensorboardx>=2.6.2.2",
    "trueskill>=0.4.5",
    "typer>=0.15.3",
    "wandb>=0.19.10",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
tpu = ["jax[tpu]"]
craftax = ["craftax==1.5.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mapox_trainer*"]
exclude = ["config*", "videos*"]

[tool.uv.sources]
mapox = { path = "../mapox-rs" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
pmarl = "mapox_trainer.cli:app"
